name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: flutter create . --platforms=android,ios --org com.lestwiix

      - name: Configure Android signing
        env:
          TWIIX_KEYSTORE_BASE64: ${{ secrets.TWIIX_KEYSTORE_BASE64 }}
          TWIIX_KEYSTORE_PASSWORD: ${{ secrets.TWIIX_KEYSTORE_PASSWORD }}
          TWIIX_KEY_PASSWORD: ${{ secrets.TWIIX_KEY_PASSWORD }}
          TWIIX_KEY_ALIAS: ${{ secrets.TWIIX_KEY_ALIAS }}
        run: |
          set -e

          echo "$TWIIX_KEYSTORE_BASE64" | base64 --decode > android/app/les-twiix-upload.jks

          cat > android/key.properties <<EOF
          storePassword=$TWIIX_KEYSTORE_PASSWORD
          keyPassword=$TWIIX_KEY_PASSWORD
          keyAlias=$TWIIX_KEY_ALIAS
          storeFile=les-twiix-upload.jks
          EOF

          python - <<'PY2'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")

          if not kts.exists():
              raise SystemExit("build.gradle.kts introuvable")

          s = kts.read_text()

          if 'import java.util.Properties' not in s:
              s = '''import java.util.Properties
import java.io.FileInputStream

''' + s

          android_marker = 'android {'
          if android_marker not in s:
              raise SystemExit("bloc android introuvable")

          signing_block = '''
    val keystoreProperties = Properties()
    val keystorePropertiesFile = rootProject.file("key.properties")
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"] as String
            keyPassword = keystoreProperties["keyPassword"] as String
            storeFile = file(keystoreProperties["storeFile"] as String)
            storePassword = keystoreProperties["storePassword"] as String
        }
    }

'''

          if 'signingConfigs {' not in s:
              s = s.replace(
                  android_marker,
                  android_marker + signing_block,
                  1,
              )

          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = 'signingConfig = signingConfigs.getByName("release")'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("signingConfig release introuvable")

          kts.write_text(s)
          print("SIGNING GRADLE OK")
          PY2

      - name: Configure Android scheduled notifications
        run: bash scripts/configure_android_notifications.sh

      - name: Apply official Twiix Android launcher icon
        run: |
          set -e
          cp branding/android_icons/ic_launcher_mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp branding/android_icons/ic_launcher_hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp branding/android_icons/ic_launcher_xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp branding/android_icons/ic_launcher_xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp branding/android_icons/ic_launcher_xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp branding/android_icons/ic_launcher_round_mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp branding/android_icons/ic_launcher_round_hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp branding/android_icons/ic_launcher_round_xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp branding/android_icons/ic_launcher_round_xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp branding/android_icons/ic_launcher_round_xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          # Flutter creates adaptive-icon XML files which keep showing the blue Flutter logo on Android 8+.
          # Removing them makes Android/Samsung use the official Twiix mipmap images above.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Add Firebase Android config
        run: cp firebase/android/google-services.json android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Twiix-APK
          path: build/app/outputs/flutter-apk/app-release.apk
