name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: flutter create . --platforms=android --project-name les_twiix_app

      - name: Apply official Twiix app icon
        shell: bash
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${d}"
            cp "branding/android_icons/ic_launcher_${d}.png" "android/app/src/main/res/mipmap-${d}/ic_launcher.png"
            cp "branding/android_icons/ic_launcher_round_${d}.png" "android/app/src/main/res/mipmap-${d}/ic_launcher_round.png"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Twiix-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
